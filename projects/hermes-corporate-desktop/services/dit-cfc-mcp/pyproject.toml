[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dit-cfc-mcp"
version = "0.2.0"
description = "Read-only MCP server for the DIT CFC portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.0.0",
  "websockets==15.0.1",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
dit-cfc-mcp = "dit_cfc_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
