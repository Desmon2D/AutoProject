[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dit-confluence-mcp"
version = "0.1.0"
description = "Read-only MCP server for the corporate Confluence instance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.0.0",
]

[project.scripts]
dit-confluence-mcp = "dit_confluence_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dit_confluence_mcp"]
