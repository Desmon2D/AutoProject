[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dit-staff-mcp"
version = "0.1.0"
description = "Read-only MCP server for the DIT Mirapolis staff portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.0.0",
]

[project.scripts]
dit-staff-mcp = "dit_staff_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
